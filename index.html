<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F2EC">
<title>Loop</title>
<meta name="description" content="Loop: the crochet app that keeps your place in every pattern and mails you a surprise hand-dyed colorway each month.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F6F2EC;
  --surface:#FFFFFF;
  --surface-2:#EFE9E1;
  --ink:#231F2B;
  --ink-2:#554E5C;
  --muted:#8A8290;
  --line:#E7E0D7;
  --rasp:#D6336C;
  --rasp-soft:#FBE3EB;
  --moss:#4F7A4E;
  --moss-soft:#E1ECDC;
  --butter:#F6C945;
  --butter-soft:#FCF1CC;
  --night:#26213A;
  --radius:22px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --spring:cubic-bezier(0.34,1.56,0.64,1);
  --shadow:0 1px 2px rgba(35,31,43,.04),0 10px 28px -14px rgba(35,31,43,.18);
  --font:"DM Sans",system-ui,-apple-system,sans-serif;
  --display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#E4DDD3;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
p{margin:0;text-wrap:pretty}
svg{display:block}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- frame ---------- */
.app{position:relative;height:100dvh;width:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
@media (min-width:520px){
  body{display:grid;place-items:center;min-height:100vh;padding:24px 0}
  .app{width:390px;height:844px;max-height:calc(100vh - 48px);border-radius:46px;box-shadow:0 0 0 10px #1c1824,0 30px 80px -20px rgba(28,24,36,.55)}
}
.scroller{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.screen{padding:calc(env(safe-area-inset-top) + 14px) 16px 28px;display:flex;flex-direction:column;gap:14px}
.screen.in>*{animation:rise 440ms var(--ease-out) both}
.screen.in>*:nth-child(2){animation-delay:40ms}
.screen.in>*:nth-child(3){animation-delay:80ms}
.screen.in>*:nth-child(4){animation-delay:120ms}
.screen.in>*:nth-child(5){animation-delay:160ms}
.screen.in>*:nth-child(n+6){animation-delay:200ms}
.screen.push>*{animation:pushIn 420ms var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pushIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 22px;border-radius:18px;font-weight:700;font-size:16px;background:var(--ink);color:#fff;transition:transform 160ms var(--ease-out),opacity 200ms ease,filter 200ms ease;user-select:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.rasp{background:var(--rasp)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.white{background:#fff;color:var(--ink)}
.btn.clear{background:rgba(255,255,255,.14);color:#fff}
.btn.sm{height:40px;padding:0 16px;font-size:14px;border-radius:13px}
.btn[disabled]{opacity:.35;pointer-events:none}
.link{color:var(--rasp);font-weight:700;font-size:14px;transition:opacity 150ms ease}
.link:active{opacity:.6}
.card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.label{font-size:13px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.title{font-family:var(--display);font-size:32px;line-height:1;letter-spacing:-.02em;font-weight:800}
.h2{font-family:var(--display);font-size:21px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.h3{font-family:var(--display);font-size:17px;line-height:1.15;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.rasp{background:var(--rasp-soft);color:var(--rasp)}
.pill.moss{background:var(--moss-soft);color:var(--moss)}
.pill.butter{background:var(--butter-soft);color:#8A6A0C}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:4px 2px 0}
.chev{color:var(--muted);flex:none}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 8px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;transition:transform 240ms var(--spring),box-shadow 180ms ease,background-color 180ms ease}
.chip:active{transform:scale(.95)}
.chip .ic{width:30px;height:30px;border-radius:9px;overflow:hidden}
.chip[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);background:var(--surface)}

.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;position:relative}
.seg button{flex:1;height:38px;border-radius:10px;font-size:14px;font-weight:700;color:var(--muted);position:relative;z-index:1;transition:color 200ms ease}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:10px;background:var(--surface);box-shadow:0 1px 3px rgba(35,31,43,.12);transition:transform 360ms var(--ease-drawer)}

.switch{width:50px;height:30px;border-radius:99px;background:#D8D0C6;position:relative;transition:background-color 220ms ease;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform 300ms var(--spring)}
.switch[aria-checked="true"]{background:var(--moss)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

.list-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.list-row:first-child{border-top:0}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);transition:transform 160ms var(--ease-out);flex:none}
.icon-btn:active{transform:scale(.92)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--butter);color:var(--ink);display:grid;place-items:center;font-weight:800;font-family:var(--display);font-size:18px;transition:transform 160ms var(--ease-out);flex:none}
.avatar:active{transform:scale(.92)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.art-bg{border-radius:18px;display:grid;place-items:center;overflow:hidden;flex:none}

/* ---------- tab bar ---------- */
.tabbar{flex:none;position:relative;display:flex;background:rgba(246,242,236,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 10px calc(env(safe-area-inset-bottom) + 6px)}
@media (min-width:520px){.tabbar{padding-bottom:18px}}
.tab-ind{position:absolute;top:6px;left:10px;height:50px;border-radius:16px;background:var(--ink);transition:transform 440ms var(--ease-drawer);z-index:0}
.tab{flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);transition:color 240ms ease;position:relative;z-index:1}
.tab svg{width:23px;height:23px;transition:transform 300ms var(--spring)}
.tab:active svg{transform:scale(.85)}
.tab[aria-current="page"]{color:#fff}
.tab .badge{position:absolute;top:7px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--rasp);box-shadow:0 0 0 2px var(--bg);animation:pop 400ms var(--spring)}

/* ---------- home ---------- */
.wip{position:relative;border-radius:28px;padding:18px;background:var(--night);color:#fff;overflow:hidden;isolation:isolate}
.wip .muted{color:rgba(255,255,255,.62)}
.wip .art{position:absolute;right:-8px;top:-4px;width:150px;z-index:-1;animation:bob 4.4s ease-in-out infinite}
.wip .glow{position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(214,51,108,.45),transparent 65%);z-index:-2}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.card .bar,.sheet .bar{background:var(--surface-2)}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--butter);transition:width 700ms var(--ease-out)}
.card .bar>i{background:var(--rasp)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:84px;margin-top:14px}
.week .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .b{width:100%;border-radius:8px;background:var(--surface-2);transform-origin:bottom;animation:grow 700ms var(--ease-out) both}
.week .b.today{background:var(--rasp)}
.week .d{font-size:11px;font-weight:700;color:var(--muted)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 10px;margin:0 -16px;scrollbar-width:none;scroll-padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.make{flex:none;width:148px;scroll-snap-align:start;background:var(--surface);border-radius:20px;padding:8px;box-shadow:var(--shadow);text-align:left}
.make .pic{height:120px;border-radius:14px;display:grid;place-items:center;overflow:hidden}
.make .pic svg{width:92px}
.heart{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);transition:color 200ms ease}
.heart svg{transition:transform 360ms var(--spring)}
.heart[aria-pressed="true"]{color:var(--rasp)}
.heart[aria-pressed="true"] svg{transform:scale(1.25)}
.drop-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--butter-soft);border-radius:var(--radius);padding:14px 16px;transition:transform 160ms var(--ease-out)}
.drop-card:active{transform:scale(.98)}

/* ---------- projects & counter ---------- */
.proj{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);transition:transform 160ms var(--ease-out)}
.proj:active{transform:scale(.98)}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lib-card{background:var(--surface);border-radius:20px;padding:8px 8px 12px;box-shadow:var(--shadow);text-align:left;transition:transform 160ms var(--ease-out)}
.lib-card:active{transform:scale(.97)}
.lib-card .pic{height:110px;border-radius:14px;display:grid;place-items:center;margin-bottom:8px}
.lib-card .pic svg{width:84px}
.counter-wrap{display:grid;place-items:center;padding:6px 0 2px;position:relative}
.counter{width:210px;height:210px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;position:relative;transition:transform 180ms var(--ease-out);box-shadow:0 18px 40px -16px rgba(35,31,43,.6);touch-action:manipulation}
.counter:active{transform:scale(.95)}
.counter .ring{position:absolute;inset:-12px}
.counter .ring circle{transition:stroke-dashoffset 600ms var(--ease-out)}
.counter .num{font-family:var(--display);font-size:74px;font-weight:800;line-height:1;letter-spacing:-.03em;display:block;height:74px;overflow:hidden}
.counter .num span{display:block}
.counter .num.flip span{animation:flip 380ms var(--ease-out)}
@keyframes flip{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
.counter .cap{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.ripple{position:absolute;inset:0;border-radius:50%;border:3px solid var(--rasp);pointer-events:none;animation:ripple 600ms var(--ease-out) forwards}
@keyframes ripple{from{transform:scale(1);opacity:.8}to{transform:scale(1.35);opacity:0}}
.step-card{background:var(--surface);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.step-card.swap{animation:swap 360ms var(--ease-out)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.instr{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.note{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--butter-soft);font-size:13px;font-weight:600;color:#6E5409}
.upnext{display:flex;flex-direction:column}
.upnext .list-row{padding:10px 0}
.abbr{font-weight:700;color:var(--ink)}
.timer{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:13px}
.timer i{width:7px;height:7px;border-radius:50%;background:var(--rasp);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- club ---------- */
.club-hero{position:relative;border-radius:30px;padding:22px 20px 20px;background:linear-gradient(170deg,#FCEFD2,#F9DCE5);overflow:hidden;text-align:center;isolation:isolate}
.club-hero .parcel{width:190px;margin:0 auto;animation:bob 4.4s ease-in-out infinite}
.big-count{font-family:var(--display);font-size:60px;font-weight:800;line-height:1;letter-spacing:-.03em}
.inside{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.inside>div{background:var(--surface);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px}
.inside .pic{width:58px;height:58px;display:grid;place-items:center}
.inside .nm{font-size:13px;font-weight:700;line-height:1.2}
.kit{flex:none;width:200px;scroll-snap-align:start;background:var(--surface);border-radius:22px;padding:8px 8px 14px;box-shadow:var(--shadow);text-align:left}
.kit .pic{height:130px;border-radius:16px;display:grid;place-items:center;margin-bottom:10px}
.kit .pic svg{width:96px}
.sticky-cta{position:sticky;bottom:0;margin:0 -16px -28px;padding:16px;background:linear-gradient(to top,var(--bg) 72%,rgba(246,242,236,0));z-index:5}
.past{display:flex;gap:10px}
.past>div{width:calc((100% - 20px)/3);text-align:center}
.past svg{width:100%}

/* ---------- stash ---------- */
.yarns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yarn{background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--shadow);text-align:left;transition:transform 160ms var(--ease-out)}
.yarn:active{transform:scale(.97)}
.yarn svg{width:100%;margin-bottom:6px}
.tin{background:linear-gradient(170deg,#3A3350,#26213A);border-radius:28px;padding:18px;color:#fff}
.tin .muted{color:rgba(255,255,255,.6)}
.charms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.charm{aspect-ratio:3/4;border-radius:16px;background:rgba(255,255,255,.07);display:grid;place-items:center;transition:transform 200ms var(--ease-out)}
.charm:active{transform:scale(.94)}
.charm svg{width:70%}
.charm.have svg{animation:sway 3.2s ease-in-out infinite;transform-origin:50% 12%}
.charm.missing svg{opacity:.28}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

/* ---------- sheets ---------- */
.backdrop{position:absolute;inset:0;background:rgba(28,24,36,.42);opacity:0;transition:opacity 420ms var(--ease-drawer);z-index:40}
.backdrop.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--bg);border-radius:30px 30px 0 0;z-index:41;transform:translateY(100%);transition:transform 500ms var(--ease-drawer);display:flex;flex-direction:column;box-shadow:0 -10px 40px -10px rgba(28,24,36,.25);touch-action:none}
.sheet.show{transform:translateY(0)}
.sheet.dragging{transition:none}
.grab{padding:10px 0 4px;display:grid;place-items:center;cursor:grab;flex:none}
.grab i{width:40px;height:5px;border-radius:99px;background:#D3CABF}
.sheet-body{overflow-y:auto;padding:6px 20px calc(env(safe-area-inset-bottom) + 24px);touch-action:pan-y;scrollbar-width:none;display:flex;flex-direction:column;gap:12px}
.sheet-body::-webkit-scrollbar{display:none}
.sheet.show .sheet-body.stagger>*{animation:rise 460ms var(--ease-out) both}
.sheet.show .sheet-body.stagger>*:nth-child(2){animation-delay:50ms}
.sheet.show .sheet-body.stagger>*:nth-child(3){animation-delay:90ms}
.sheet.show .sheet-body.stagger>*:nth-child(4){animation-delay:130ms}
.sheet.show .sheet-body.stagger>*:nth-child(n+5){animation-delay:170ms}
@media (min-width:520px){.sheet-body{padding-bottom:32px}}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:2px}
.x-btn{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;transition:transform 160ms var(--ease-out)}
.x-btn:active{transform:scale(.9)}

/* ---------- timeline ---------- */
.track{position:relative;height:6px;border-radius:99px;background:var(--surface-2);margin:18px 6px 22px}
.dark .track{background:rgba(255,255,255,.16);margin:14px 0 4px}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--rasp);transition:width 900ms var(--ease-out)}
.dark .track .fill{background:var(--butter)}
.track .van{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.2);transition:left 900ms var(--ease-out)}
.track .van svg{animation:rumble 600ms ease-in-out infinite}
@keyframes rumble{50%{transform:translateY(-1px)}}
.timeline{position:relative;padding-left:28px}
.tl-item{position:relative;padding-bottom:14px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-21px;top:18px;bottom:-2px;width:2px;background:var(--line);transition:background-color 400ms ease}
.tl-item:last-child::before{display:none}
.tl-item.done::before{background:var(--rasp)}
.tl-dot{position:absolute;left:-28px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);transition:background-color 300ms ease,box-shadow 300ms ease}
.tl-item.done .tl-dot,.tl-item.current .tl-dot{background:var(--rasp);box-shadow:none}
.tl-item.current .tl-dot{box-shadow:0 0 0 5px var(--rasp-soft)}
.tl-label{font-weight:700}
.tl-item:not(.done):not(.current) .tl-label{color:var(--muted)}
.live-strip{display:block;width:100%;text-align:left;background:var(--night);color:#fff;border-radius:var(--radius);padding:16px;transition:transform 160ms var(--ease-out)}
.live-strip:active{transform:scale(.98)}
.live-strip .muted{color:rgba(255,255,255,.62)}

/* ---------- toast ---------- */
.toast-wrap{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;z-index:80;pointer-events:none;display:flex;justify-content:center}
@media (min-width:520px){.toast-wrap{top:14px}}
.toast{position:absolute;pointer-events:auto;background:#1c1824;color:#fff;border-radius:22px;padding:10px 16px 10px 10px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:0 14px 30px -10px rgba(0,0,0,.45);transform:translateY(-16px) scale(.6);opacity:0;transition:transform 520ms var(--spring),opacity 220ms ease;max-width:calc(100% - 32px)}
.toast.show{transform:none;opacity:1}
.toast.hide{transform:translateY(-12px) scale(.85);opacity:0;transition:transform 260ms var(--ease-out),opacity 200ms ease}
.toast .t-ic{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none;color:var(--butter)}

/* ---------- onboarding ---------- */
.ob{flex:1;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 20px);overflow-y:auto;overflow-x:hidden;position:relative;isolation:isolate}
@media (min-width:520px){.ob{padding-top:34px;padding-bottom:28px}}
.ob-dots{display:flex;gap:6px}
.ob-dots i{height:6px;width:6px;border-radius:99px;background:var(--line);transition:width 400ms var(--ease-drawer),background-color 300ms ease}
.ob-dots i.on{width:22px;background:var(--ink)}
.ob-body{flex:1;display:flex;flex-direction:column}
.ob-body.fwd>*{animation:pushIn 480ms var(--ease-out) both}
.ob-body.back>*{animation:pushBack 480ms var(--ease-out) both}
.ob-body>*:nth-child(2){animation-delay:40ms!important}
.ob-body>*:nth-child(3){animation-delay:80ms!important}
.ob-body>*:nth-child(4){animation-delay:120ms!important}
.ob-body>*:nth-child(5){animation-delay:160ms!important}
@keyframes pushBack{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.field{display:block;background:var(--surface);border-radius:18px;padding:12px 16px;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow 180ms ease}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.field .lbl{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.field input{border:0;outline:0;background:none;width:100%;font-size:17px;padding:2px 0 0;min-height:28px}
.option{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow 180ms ease,transform 160ms var(--ease-out)}
.option:active{transform:scale(.98)}
.option[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.palettes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pal{border-radius:20px;padding:10px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);text-align:left;transition:box-shadow 180ms ease,transform 240ms var(--spring)}
.pal:active{transform:scale(.96)}
.pal[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.pal .sw{display:flex;height:54px;border-radius:12px;overflow:hidden;margin-bottom:8px}
.pal .sw i{flex:1;transition:flex 400ms var(--ease-out)}
.pal[aria-pressed="true"] .sw i:nth-child(2){flex:1.6}
.pal .nm{font-weight:700;font-size:14px}
.welcome-art{position:relative;height:280px}
.welcome-art>*{position:absolute}
.welcome-bg{position:absolute;inset:0;z-index:-1;background:radial-gradient(90% 50% at 50% 18%,#FBE3EB 0%,rgba(246,242,236,0) 70%)}

/* ---------- reveal ---------- */
.stage{height:300px;display:grid;place-items:center;position:relative}
.stage>*{grid-area:1/1}
.stage .glow{width:300px;height:300px;border-radius:50%;opacity:0;transform:scale(.5);transition:opacity 700ms ease,transform 1000ms var(--ease-out)}
.stage.open .glow{opacity:1;transform:none}
.wrapbox{position:relative;width:220px;height:170px;cursor:pointer;z-index:3}
.wrapbox svg{width:100%;height:100%;overflow:visible}
.wrapbox .twine,.wrapbox .bow{transition:transform 600ms var(--ease-out),opacity 400ms ease;transform-box:fill-box;transform-origin:center}
.untied .twine{opacity:0;transform:scale(1.2)}
.untied .bow{opacity:0;transform:translateY(-40px) rotate(-40deg) scale(.6)}
.wrapbox .paperL,.wrapbox .paperR,.wrapbox .tag{transition:transform 750ms var(--ease-out),opacity 500ms ease 150ms}
.stage.open .paperL{transform:translateX(-150px) rotate(-14deg);opacity:0}
.stage.open .paperR{transform:translateX(150px) rotate(14deg);opacity:0}
.stage.open .base{opacity:0!important}
.wrapbox .base{transition:opacity 500ms ease 250ms}
.stage.open .tag{transform:translateY(80px) rotate(30deg);opacity:0}
.stage.open .wrapbox{pointer-events:none}
.wrapbox.nudge{animation:nudge2 420ms var(--ease-out)}
@keyframes nudge2{25%{transform:rotate(-4deg) scale(1.02)}60%{transform:rotate(3deg)}}
.reveal-skein{width:230px;opacity:0;transform:translateY(40px) scale(.7);filter:blur(8px);transition:opacity 500ms var(--ease-out) 300ms,transform 900ms var(--spring) 300ms,filter 500ms var(--ease-out) 300ms;z-index:2}
.stage.open .reveal-skein{opacity:1;transform:none;filter:none}
.reveal-charm{width:64px;z-index:4;align-self:start;justify-self:end;margin:10px 18px 0 0;opacity:0;transform:translateY(-120px) rotate(-30deg)}
.stage.open .reveal-charm{animation:drop 900ms var(--spring) 900ms forwards}
@keyframes drop{0%{opacity:0;transform:translateY(-120px) rotate(-30deg)}60%{opacity:1}100%{opacity:1;transform:none}}
.stage.open .reveal-charm svg{animation:sway 3s ease-in-out 1.8s infinite;transform-origin:50% 12%}
.particle{position:absolute;left:0;top:0;pointer-events:none;z-index:90;border-radius:3px}
.check-anim{width:84px;height:84px;border-radius:50%;background:var(--moss-soft);display:grid;place-items:center;margin:4px auto 0;animation:pop 520ms var(--spring) both}
.check-anim path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw 420ms var(--ease-out) 220ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin 700ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.swatch-name{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}

@media (hover:hover) and (pointer:fine){
  .btn:hover{filter:brightness(1.1)}
  .proj:hover,.lib-card:hover,.yarn:hover,.icon-btn:hover,.make:hover,.kit:hover{transform:translateY(-2px)}
  .tab:not([aria-current]):hover{color:var(--ink-2)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0ms!important;animation-delay:0ms!important}
}
:focus-visible{outline:2px solid var(--rasp);outline-offset:2px;border-radius:12px}
</style>

const STAGES = [

function orderElapsed(o){ return (Date.now() - o.placedAt)/1000 * (S.demoFast ? 1 : 0.01); }
function orderStage(o){ const e = orderElapsed(o); let i = 0; STAGES.forEach((s,idx)=>{ if (e >= s.t) i = idx; }); return i; }
function pickWay(){
  const fams = S.palettes.length ? S.palettes : PALETTES.map(p=>p.id);
  const pool = PALETTES.filter(p=>fams.includes(p.id)).flatMap(p=>p.ways).filter(w=>!S.stash.some(s=>s.way===w));
  const list = pool.length ? pool : Object.keys(COLORWAYS);
  return list[Math.floor(Math.random()*list.length)];
}
function pickCharm(){
  const missing = CHARMS.filter(c=>!S.charms[c.id]);
  const common = missing.filter(c=>!c.special);
  if (missing.some(c=>c.special) && Math.random() < 0.08) return 'gold';
  const list = common.length ? common : CHARMS;
  return list[Math.floor(Math.random()*list.length)].id;
}
function placeOrder(kind, ref){
  const month = monthName(new Date());
  const o = {
    id: 'LP-' + Math.floor(10000 + Math.random()*89999), kind, ref, placedAt: Date.now(),
    title: kind==='drop' ? `${month} drop` : `${PATTERNS[KITS.find(k=>k.id===ref).pattern].name} kit`,
    total: kind==='drop' ? CLUB_PRICE : KITS.find(k=>k.id===ref).price,
    way: kind==='drop' ? pickWay() : PATTERNS[KITS.find(k=>k.id===ref).pattern].way,
    charm: pickCharm(),
    state: 'sealed',
  };
  S.orders.unshift(o);
  if (kind==='drop'){ S.club = true; S.skip = false; }
  ui.lastStages[o.id] = 0;

  return o;
}

function toast(msg, icon=I.spark){
  const wrap = $('#toasts');
  wrap.querySelectorAll('.toast').forEach(o=>{ o.classList.add('hide'); setTimeout(()=>o.remove(), 280); });
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role','status');

  wrap.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));

  el.onclick = ()=>el.classList.add('hide');

function burst(x, y, n=18, colors=['#F6C945','#D6336C','#9ED8CF','#B9A6E0','#F7B89A']){
  if (reduced()) return;
  const app = $('#app'), r = app.getBoundingClientRect();
  for (let i=0;i<n;i++){
    const p = document.createElement('i'); p.className = 'particle';
    const s = 5 + Math.random()*6;
    p.style.cssText = `width:${s}px;height:${s*(Math.random()>.5?1:1.8)}px;background:${colors[i%colors.length]}`;
    app.appendChild(p);
    const a = Math.random()*Math.PI*2, d = 70 + Math.random()*110;
    const x0 = x - r.left, y0 = y - r.top, x1 = x0 + Math.cos(a)*d, y1 = y0 + Math.sin(a)*d - 40;
    p.animate([
      {transform:`translate(${x0}px,${y0}px) rotate(0)`, opacity:1},
      {transform:`translate(${x1}px,${y1}px) rotate(${Math.random()*540}deg)`, opacity:1, offset:.6},
      {transform:`translate(${x1}px,${y1+60}px) rotate(${Math.random()*720}deg) scale(.4)`, opacity:0},
    ], {duration: 900 + Math.random()*400, easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = ()=>p.remove();
  }
}

let sheet = null;
function openSheet(render, opts={}){
  closeSheet(true);
  const root = $('#sheet-root');
  const bd = document.createElement('div'); bd.className = 'backdrop';
  const sh = document.createElement('div'); sh.className = 'sheet';
  sh.setAttribute('role','dialog'); sh.setAttribute('aria-modal','true');
  sh.innerHTML = `<div class="grab" aria-hidden="true"><i></i></div><div class="sheet-body stagger"></div>`;
  root.append(bd, sh);
  sheet = {bd, sh, render, opts, body: sh.querySelector('.sheet-body')};
  sheet.body.innerHTML = render();
  opts.onMount && opts.onMount(sheet.body);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ bd.classList.add('show'); sh.classList.add('show'); }));
  const opened = performance.now();
  bd.addEventListener('click', ()=>{ if (performance.now() - opened > 350) closeSheet(); });  // ignore ghost taps from the opening tap
  enableDrag(sh);
}
function refreshSheet(){
  if (!sheet || sheet.opts.static) return;
  sheet.body.classList.remove('stagger');
  sheet.body.innerHTML = sheet.render();
  sheet.opts.onMount && sheet.opts.onMount(sheet.body);
}
function closeSheet(instant){
  if (!sheet) return;
  const {bd, sh} = sheet; sheet = null;
  if (instant){ bd.remove(); sh.remove(); return; }
  bd.classList.remove('show'); sh.classList.remove('show'); sh.style.transform = '';
  setTimeout(()=>{ bd.remove(); sh.remove(); }, 500);
}
function enableDrag(sh){
  let y0=null, t0=0, dy=0; const body = sh.querySelector('.sheet-body');
  const move = e=>{ if (y0===null) return; dy = e.clientY - y0; sh.classList.add('dragging'); sh.style.transform = `translateY(${dy > 0 ? dy : dy*0.12}px)`; };
  const up = ()=>{
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
    if (y0===null) return;
    const v = dy / Math.max(1, performance.now()-t0);
    sh.classList.remove('dragging');
    if (dy > 110 || v > 0.6) closeSheet(); else sh.style.transform = '';
    y0 = null;
  };
  sh.addEventListener('pointerdown', e=>{
    if (!e.target.closest('.grab') && (body.scrollTop > 0 || e.target.closest('button,input,a,.seg,.wrapbox'))) return;
    y0 = e.clientY; t0 = performance.now(); dy = 0;
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  });
}

let timerInt = null;

}

    set('[data-live-fill]', el=>el.style.width = `${st/4*100}%`);
    set('[data-live-van]', el=>el.style.left = `${Math.min(94,Math.max(4,st/4*100))}%`);
    root.querySelectorAll('[data-live-step]').forEach(el=>{ const i = +el.dataset.liveStep; el.classList.toggle('done', i<st); el.classList.toggle('current', i===st); });
  });
}
function openUnwrap(id){
  const o = findOrder(id); if (!o) return;
  const w = COLORWAYS[o.way], ch = CHARMS.find(c=>c.id===o.charm);
  const isNewCharm = !S.charms[o.charm];
  let taps = 0;
  openSheet(()=>`
    ${sheetHead(o.title, o.kind==='drop'?'Hand-dyed, one batch only':'Your kit')}
    <div class="stage" id="stage">
      <div class="glow" style="background:radial-gradient(circle,${w.c[0]}88,transparent 65%)"></div>
      <div class="reveal-skein">${skeinSVG(o.way)}</div>
      <div class="reveal-charm">${charmSVG(o.charm)}</div>
      <button class="wrapbox" id="wrap" aria-label="Untie the parcel">${PARCEL('♥')}</button>
    </div>
    <div id="uw-copy" style="text-align:center;min-height:132px"><p style="font-weight:700" id="uw-hint">Tap to untie</p></div>
  `, {static:true, onMount:(body)=>{
    const wrap = body.querySelector('#wrap'), stage = body.querySelector('#stage');
    wrap.addEventListener('click', ()=>{
      taps++; buzz(10);
      replay(wrap, 'nudge2 420ms var(--ease-out)');
      if (taps===1){ wrap.classList.add('untied'); body.querySelector('#uw-hint').textContent = 'Now open it'; return; }
      if (taps===2){
        stage.classList.add('open'); buzz(30);
        setTimeout(()=>{ const [x,y] = centerOf(stage); burst(x, y, 26, [...w.c, '#F6C945']); }, 350);
        o.state = 'opened';
        S.stash.unshift({way:o.way, weight:'Worsted', yds:200, from:o.kind==='drop'?'Club':'Kit'});
        S.charms[o.charm] = (S.charms[o.charm]||0) + 1;
        if (o.kind==='kit'){ const pid = KITS.find(k=>k.id===o.ref).pattern; if (!S.projects.some(p=>p.pid===pid && !p.done)) S.projects.push({pid, step:0, minutes:0, done:false}); }
        save(); render();
        body.querySelector('#uw-copy').innerHTML = `<div style="animation:rise 500ms var(--ease-out) 500ms both">
          <p class="label">This month's colorway</p>
          <div class="swatch-name" style="margin-top:6px">${w.name}</div>
          <div class="row" style="justify-content:center;gap:6px;margin-top:10px"><span class="pill butter">+ ${ch.name} charm${isNewCharm?'':' (extra)'}</span></div>
          <div class="row" style="gap:8px;margin-top:16px">
            <button class="btn ghost" style="flex:1" data-act="goto-stash">See stash</button>
            <button class="btn rasp" style="flex:1" data-act="${o.kind==='kit'?'goto-make':'start-drop'}">${o.kind==='kit'?'Start making':'Get the pattern'}</button>
          </div></div>`;
      }
    });
  }});
}
function openCharm(id){
  const c = CHARMS.find(x=>x.id===id), n = S.charms[id];
  openSheet(()=>`${sheetHead(n?c.name:'Not yet', 'Autumn Market · stitch marker')}
    <div style="width:110px;margin:6px auto;animation:sway 3s ease-in-out infinite;transform-origin:50% 12%">${(n||!c.special)?charmSVG(id,{dim:!n}):'<div class="swatch-name" style="text-align:center;opacity:.3">?</div>'}</div>
    <p class="muted" style="text-align:center">${n?`You have ${n}. Clip it on to mark your first stitch.`:c.special?'Tucked into a few parcels this season.':'Comes in a future drop or kit.'}</p>`);
}
function openYarn(i){
  const s = S.stash[i]; if (!s) return;
  const w = COLORWAYS[s.way];
  const fits = Object.entries(PATTERNS).filter(([,P])=>P.yarn.startsWith(s.weight)).map(([id])=>id);
  openSheet(()=>`${sheetHead(w.name, `${s.weight} · ${s.yds} yds · from ${s.from}`)}
    <div style="width:220px;margin:0 auto">${skeinSVG(s.way)}</div>
    <div class="row" style="justify-content:center;gap:6px">${w.c.map(c=>`<i style="width:28px;height:28px;border-radius:50%;background:${c};box-shadow:inset 0 0 0 2px rgba(0,0,0,.05)"></i>`).join('')}</div>
    ${fits.length?`<div class="label" style="margin-top:4px">Makes enough for</div>${fits.map(id=>`<button class="proj" data-act="pattern" data-v="${id}">${artTile(`<span style="width:40px">${projArt(PATTERNS[id].art, s.way)}</span>`, w.c[1], 52, 14)}<div class="grow"><div class="h3">${PATTERNS[id].name}</div><div class="small muted">${PATTERNS[id].level}</div></div>${I.chevR}</button>`).join('')}`:''}`);
}
function openDone(pid){
  const P = PATTERNS[pid];
  openSheet(()=>`<div style="text-align:center;padding-top:6px">
      <div style="width:150px;margin:0 auto;animation:bob 3s ease-in-out infinite">${projArt(P.art,P.way)}</div>
      <h2 class="title" style="margin-top:12px">You finished ${P.name}!</h2>
      <p class="muted" style="margin-top:6px">${P.steps.length} steps. Show it off to the Club.</p>
    </div>
    <button class="btn block rasp" data-act="share">Share to the Club feed</button>
    <button class="btn block ghost" data-act="close-done" style="margin-top:-4px">Done</button>`);
  setTimeout(()=>{ if (sheet){ const [x,y] = centerOf(sheet.body.firstElementChild); burst(x, y-40, 30); } }, 400);
}
function openProfile(){
  openSheet(()=>`
    ${sheetHead(esc(S.name||'You'), S.club?`Club member · ${money(CLUB_PRICE)}/month`:'Free plan')}
    ${S.club?`<div class="card" style="padding:4px 18px">
      <div class="list-row"><span class="grow">${S.skip?'Skipping next drop':'Skip next drop'}</span><button class="btn sm ghost" data-act="skip">${S.skip?'Undo':'Skip'}</button></div>
      <div class="list-row"><span class="grow">Leave the Club</span><button class="btn sm ghost" data-act="cancel">Leave</button></div>
    </div>`:''}
    <div class="label" style="margin:4px 4px -4px">Demo controls</div>
    <div class="card" style="padding:4px 18px">
      <div class="list-row"><span class="grow">Fast shipping</span><button class="switch" role="switch" aria-label="Fast shipping" aria-checked="${S.demoFast}" data-act="fast"></button></div>
      <div class="list-row"><span class="grow">Start over</span><button class="btn sm ghost" data-act="reset">Reset</button></div>
    </div>
    <p class="small muted" style="text-align:center">Loop demo. Everything stays on this device.</p>`);
}
function confirmSheet(title, msg, yes, onYes){
  openSheet(()=>`${sheetHead(title)}<p class="muted">${msg}</p>
    <button class="btn block" data-act="confirm-yes">${yes}</button>
    <button class="btn block ghost" data-act="close" style="margin-top:-4px">Never mind</button>`);
  sheet.onYes = onYes;
}

/* ---------- Actions ---------- */
function setTab(v){
  if (ui.open){ stopTimer(); ui.open = null; }
  const same = ui.tab===v; ui.tab=v;
  closeSheet(); renderTabs(); renderScreen(!same);
  if (!same) $('#scroller').scrollTop=0;
}
function openProject(pid){
  ui.tab='make'; ui.open=pid; closeSheet(); renderTabs(); renderScreen('push'); $('#scroller').scrollTop=0; startTimer();
}
function readOb(){ const n = $('#ob-name'); if (n) S.name = n.value.trim(); }
function toggleIn(arr, v){ const i = arr.indexOf(v); i>=0 ? arr.splice(i,1) : arr.push(v); return i<0; }
const A = {
  'tab':(el,v)=>setTab(v),
  'ob-next':()=>{ readOb(); ui.obStep++; ui.obDir='fwd'; save(); render(); },
  'ob-back':()=>{ readOb(); ui.obStep=Math.max(0,ui.obStep-1); ui.obDir='back'; render(); },
  'ob-level':(el,v)=>{ S.level=v; document.querySelectorAll('[data-act="ob-level"]').forEach(b=>b.setAttribute('aria-pressed', b===el)); buzz(6); },
  'ob-love':(el,v)=>{ el.setAttribute('aria-pressed', toggleIn(S.loves, v)); buzz(6); },
  'ob-pal':(el,v)=>{ el.setAttribute('aria-pressed', toggleIn(S.palettes, v)); buzz(6); },
  'ob-finish':()=>{ S.onboarded=true; ui.tab='home'; save(); render(true); },
  'seg':(el,v)=>{
    const wrap = el.closest('.seg'), btns=[...wrap.querySelectorAll('button')], i=btns.indexOf(el);
    wrap.querySelector('.thumb').style.transform = `translateX(${i*100}%)`;
    btns.forEach(b=>b.setAttribute('aria-pressed', b===el));
    if (el.dataset.seg==='stash'){ ui.stashView=v; setTimeout(()=>{ renderScreen(); const s = $('#screen'); [...s.children].slice(2).forEach(c=>replay(c,'rise 380ms var(--ease-out)')); }, 120); }
  },
  'open-proj':(el,v)=>openProject(v),
  'close-proj':()=>{ stopTimer(); ui.open=null; renderScreen('in'); },
  'count':(el)=>{
    const p = S.projects.find(x=>x.pid===ui.open && !x.done); if (!p) return;
    const P = PATTERNS[p.pid];
    buzz(12);
    const r = document.createElement('i'); r.className='ripple'; el.appendChild(r); setTimeout(()=>r.remove(), 650);
    p.step++; save();
    if (p.step >= P.steps.length){ stopTimer(); p.done=true; p.step=P.steps.length-1; save(); ui.open=null; renderScreen('in'); openDone(p.pid); return; }
    const s = P.steps[p.step];
    const card = $('#step-card');
    card.innerHTML = `<div class="row between"><span class="pill rasp">${s.label}</span>${s.st?`<span class="small muted tnum">${s.st} sts</span>`:''}</div><div class="instr" style="margin-top:10px">${esc(s.text)}</div>${s.note?`<div class="note">${I.pin}<span>${esc(s.note)}</span></div>`:''}`;
    replay(card,'swap 360ms var(--ease-out)');
    const cap = $('#cap'); if (cap) cap.textContent = /^R\d/.test(s.label) ? 'Round' : (s.label.match(/^[A-Za-z]+/)?.[0]||'Step');
    const num = $('#num'); num.innerHTML = `<span>${s.label.replace(/^[A-Za-z ]+/,'') || '✓'}</span>`; replay(num.firstChild,'flip 380ms var(--ease-out)');
    const C = 2*Math.PI*112; $('#ring-fill').style.strokeDashoffset = C*(1-p.step/P.steps.length);
    const rest = $('#screen'); const tmp = document.createElement('div'); tmp.innerHTML = renderCounter(p.pid);
    const newNext = tmp.querySelector('.upnext'), oldNext = rest.querySelector('.upnext');
    if (oldNext && newNext) oldNext.innerHTML = newNext.innerHTML; else if (oldNext) oldNext.remove();
    rest.querySelector('.pill.tnum').textContent = `${p.step} of ${P.steps.length} done`;
    rest.querySelector('[data-act="undo"]').disabled = false;
    if (s.note) buzz(20);
  },
  'undo':()=>{ const p = S.projects.find(x=>x.pid===ui.open && !x.done); if (!p || p.step===0) return; p.step--; save(); renderScreen(); toast('Back one step', I.undo); },
  'pattern':(el,v)=>openPattern(v),
  'start':(el,v)=>{ if (!S.projects.some(p=>p.pid===v && !p.done)) S.projects.unshift({pid:v, step:0, minutes:0, done:false}); save(); openProject(v); },
  'like':(el,v)=>{ S.liked[v]=!S.liked[v]; save(); buzz(6); el.setAttribute('aria-pressed', S.liked[v]); el.querySelector('span').textContent = FEED[v].likes + (S.liked[v]?1:0); if (S.liked[v]){ const [x,y]=centerOf(el); burst(x,y,8,['#D6336C','#F7B89A','#FBE3EB']); } },
  'checkout':(el,v)=>openCheckout(v),
  'pay':()=>sheet && sheet.pay && sheet.pay(),
  'order':(el,v)=>openOrder(v),
  'order-from-done':(el,v)=>{ closeSheet(true); setTab('club'); openOrder(v); },
  'unwrap':(el,v)=>openUnwrap(v),
  'irl':(el,v)=>{ const o=findOrder(v); o.state='irl'; save(); closeSheet(); render(); toast('Saved. No spoilers here.', I.gift); },
  'goto-stash':()=>{ closeSheet(); ui.stashView='Yarn'; setTab('stash'); },
  'goto-make':()=>{ closeSheet(); setTab('make'); },
  'start-drop':()=>{ closeSheet(); A.start(null, 'hat'); toast('Pattern added. Bucket hats love this yarn.', I.spark); },
  'charm':(el,v)=>openCharm(v),
  'yarn':(el,v)=>openYarn(+v),
  'share':()=>{ closeSheet(); toast('Posted to the Club feed', I.heart); },
  'close-done':()=>closeSheet(),
  'skip':()=>{ S.skip=!S.skip; save(); refreshSheet(); renderScreen(); toast(S.skip?'Skipped. No charge this month.':"You're in for next month", I.check); },
  'ship-now':()=>{ const o = placeOrder('drop'); render(); openOrder(o.id); },
  'cancel':()=>confirmSheet('Leave the Club?', 'Your patterns, stash and charms stay yours.', 'Leave', ()=>{ S.club=false; S.skip=false; save(); render(); toast('You left the Club', I.check); }),
  'confirm-yes':()=>{ const f = sheet && sheet.onYes; closeSheet(); f && f(); },
  'profile':()=>openProfile(),
  'close':()=>closeSheet(),
  'fast':(el)=>{ const next = !S.demoFast; S.orders.forEach(o=>{ const e = orderElapsed(o); o.placedAt = Date.now() - e*1000/(next?1:0.01); }); S.demoFast = next; save(); el.setAttribute('aria-checked', next); },
  'reset':()=>confirmSheet('Start over?', 'This clears the demo on this device.', 'Reset', ()=>{ stopTimer(); S=freshState(); ui.obStep=0; ui.obDir='fwd'; ui.tab='home'; ui.open=null; $('#tabbar').innerHTML=''; save(); render(); }),
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) f(el, el.dataset.v);
});
document.addEventListener('keydown', e=>{
  if (e.key==='Escape') closeSheet();
  if ((e.key===' ' || e.key==='Enter') && ui.open && !sheet && document.activeElement===document.body){ e.preventDefault(); $('#counter')?.click(); }
});

/* ---------- Shipping clock ---------- */
setInterval(()=>{
  if (!S.onboarded) return;
  S.orders.forEach(o=>{
    const st = orderStage(o), prev = ui.lastStages[o.id];
    if (prev===undefined){ ui.lastStages[o.id]=st; return; }
    if (st===prev) return;
    ui.lastStages[o.id]=st;
    if (st<4){ patchLive(o); if (st===2) toast(`${o.title} is on the way`, I.van); return; }
    toast(`${o.title} was delivered`, I.gift); buzz(20);
    renderTabs();
    const live = $('#h-live'); if (live && !ui.open){ live.innerHTML = renderLive(); replay(live,'pop 520ms var(--spring)'); }
    else if (ui.tab==='club') renderScreen();
    if (sheet && sheet.orderId===o.id) refreshSheet();
  });
}, 1000);

render(true);
</script>
</body>
</html>
