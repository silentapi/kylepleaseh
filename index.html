<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6F1">
<title>Lune</title>
<meta name="description" content="Lune: a free cycle tracker, plus a period kit that shows up before your period does, with a mystery collectible inside.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#FBF6F1;
  --surface:#FFFFFF;
  --surface-2:#F5EEE8;
  --ink:#2A1B2E;
  --ink-2:#5E4E62;
  --muted:#8C7D8F;
  --line:#EDE3DC;
  --berry:#B23A6E;
  --berry-ink:#FFFFFF;
  --berry-soft:#F8E1EA;
  --period:#E0567A;
  --predicted:#F7CAD6;
  --fertile:#D3EBDD;
  --fertile-ink:#2F6B4B;
  --lilac:#EDE4F6;
  --gold:#C99A2E;
  --ok:#2F8F5B;
  --radius:20px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --shadow:0 1px 2px rgba(42,27,46,.04),0 8px 24px -12px rgba(42,27,46,.12);
  --font:"DM Sans",system-ui,-apple-system,sans-serif;
  --display:"Fraunces",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#E9E0DA;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{text-wrap:pretty}
p{margin:0}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- phone frame ---------- */
.app{position:relative;height:100dvh;width:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:520px){
  body{display:grid;place-items:center;min-height:100vh;padding:24px 0}
  .app{width:390px;height:844px;max-height:calc(100vh - 48px);border-radius:44px;box-shadow:0 0 0 10px #1d1420,0 30px 80px -20px rgba(29,20,32,.55)}
}
.scroller{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.screen{padding:calc(env(safe-area-inset-top) + 16px) 16px 24px}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:16px;font-weight:600;font-size:16px;background:var(--berry);color:var(--berry-ink);transition:transform 160ms var(--ease-out),background-color 200ms ease,opacity 200ms ease;user-select:none}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.outline{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--berry);font-weight:600;font-size:14px;transition:opacity 150ms ease}
.link:active{opacity:.6}
.card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.title{font-family:var(--display);font-size:28px;line-height:1.1;letter-spacing:-.01em;font-weight:600}
.h2{font-family:var(--display);font-size:20px;line-height:1.2;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.berry{background:var(--berry-soft);color:var(--berry)}
.pill.green{background:var(--fertile);color:var(--fertile-ink)}
.pill.gold{background:#FBEFD0;color:#8A6412}
.pill.lilac{background:var(--lilac);color:#5B3F86}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:12px;background:var(--surface-2);font-size:14px;font-weight:500;color:var(--ink-2);transition:transform 160ms var(--ease-out),background-color 180ms ease,color 180ms ease,box-shadow 180ms ease}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}

.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;position:relative}
.seg button{flex:1;height:38px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);position:relative;z-index:1;transition:color 200ms ease}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:10px;background:var(--surface);box-shadow:0 1px 3px rgba(42,27,46,.12);transition:transform 260ms var(--ease-out)}

.stepper{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:12px;padding:3px}
.stepper button{width:34px;height:32px;border-radius:9px;font-size:18px;font-weight:600;color:var(--ink-2);transition:transform 140ms var(--ease-out),background-color 150ms ease}
.stepper button:active{transform:scale(.9);background:var(--surface)}
.stepper span{min-width:28px;text-align:center;font-weight:600}

.switch{width:48px;height:30px;border-radius:99px;background:#DCD1CA;position:relative;transition:background-color 200ms ease;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform 240ms var(--ease-out)}
.switch[aria-checked="true"]{background:var(--berry)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

.list-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);transition:transform 160ms var(--ease-out)}
.icon-btn:active{transform:scale(.94)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--berry-soft);color:var(--berry);display:grid;place-items:center;font-weight:600;font-family:var(--display);font-size:18px;transition:transform 160ms var(--ease-out)}
.avatar:active{transform:scale(.94)}

/* ---------- tab bar ---------- */
.tabbar{flex:none;display:flex;background:rgba(251,246,241,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
@media (min-width:520px){.tabbar{padding-bottom:18px}}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);transition:color 180ms ease,transform 160ms var(--ease-out);position:relative}
.tab:active{transform:scale(.94)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--berry)}
.tab .badge{position:absolute;top:3px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--period);box-shadow:0 0 0 2px var(--bg)}

/* ---------- home ---------- */
.ring-wrap{position:relative;width:196px;height:196px;margin:4px auto 0}
.ring-wrap svg{position:absolute;inset:0}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center .big{font-family:var(--display);font-size:44px;line-height:1;font-weight:600;letter-spacing:-.02em}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:inherit;background:var(--berry);transition:width 600ms var(--ease-out)}
.stars{display:flex;gap:6px}
.stars svg{width:22px;height:22px}
.star-on{animation:starPop 420ms var(--ease-out)}
@keyframes starPop{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

.box-hero{background:linear-gradient(160deg,#3A2140 0%,#5C2A55 55%,#8E3767 100%);color:#fff;border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.box-hero .muted{color:rgba(255,255,255,.72)}
.box-hero .btn{background:#fff;color:var(--ink)}
.box-hero .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.box-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}

/* ---------- timeline ---------- */
.timeline{position:relative;padding-left:28px}
.tl-item{position:relative;padding-bottom:18px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-21px;top:18px;bottom:-2px;width:2px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-item.done::before{background:var(--berry)}
.tl-dot{position:absolute;left:-28px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);transition:background-color 300ms ease,box-shadow 300ms ease}
.tl-item.done .tl-dot{background:var(--berry);box-shadow:none}
.tl-item.current .tl-dot{background:var(--berry);box-shadow:0 0 0 5px var(--berry-soft)}
.tl-item.current .tl-dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--berry);opacity:0;animation:ping 1.6s var(--ease-out) infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.tl-label{font-weight:600}
.tl-item:not(.done):not(.current) .tl-label{color:var(--muted)}

.mini-steps{display:flex;gap:4px}
.mini-steps i{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;position:relative}
.mini-steps i.on{background:#fff}
.card .mini-steps i{background:var(--surface-2)}
.card .mini-steps i.on{background:var(--berry)}

/* ---------- calendar ---------- */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:500;position:relative;transition:transform 140ms var(--ease-out)}
.day:active{transform:scale(.9)}
.day.out{visibility:hidden}
.day.period{background:var(--period);color:#fff}
.day.predicted{background:var(--predicted);color:#8B2446}
.day.fertile{background:var(--fertile);color:var(--fertile-ink)}
.day.ovulation{background:var(--fertile);color:var(--fertile-ink);box-shadow:inset 0 0 0 2px #7BBF98}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day .mk{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
.day.period .mk{background:#fff}
.day.boxday{background:#3A2140;color:#fff}
.day.boxday .mk{background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- collection ---------- */
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.buddy-tile{background:var(--surface);border-radius:18px;padding:10px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);position:relative;transition:transform 160ms var(--ease-out)}
.buddy-tile:active{transform:scale(.96)}
.buddy-tile svg{width:72px;height:72px}
.buddy-tile .nm{font-size:12px;font-weight:600}
.buddy-tile.locked .nm{color:var(--muted)}
.buddy-tile .flags{display:flex;gap:3px;height:14px;align-items:center}
.flag{font-size:9px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:5px;text-transform:uppercase}
.flag.p{background:var(--ink);color:#fff}
.flag.d{background:var(--lilac);color:#5B3F86}
.flag.r{background:#FBEFD0;color:#8A6412}

/* ---------- sheets ---------- */
.backdrop{position:absolute;inset:0;background:rgba(29,20,32,.4);opacity:0;transition:opacity 400ms var(--ease-drawer);z-index:40}
.backdrop.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--bg);border-radius:28px 28px 0 0;z-index:41;transform:translateY(100%);transition:transform 480ms var(--ease-drawer);display:flex;flex-direction:column;box-shadow:0 -10px 40px -10px rgba(29,20,32,.25);touch-action:none}
.sheet.show{transform:translateY(0)}
.sheet.dragging{transition:none}
.grab{padding:10px 0 4px;display:grid;place-items:center;cursor:grab;flex:none}
.grab i{width:40px;height:5px;border-radius:99px;background:#D7CBC4}
.sheet-body{overflow-y:auto;padding:8px 20px calc(env(safe-area-inset-bottom) + 24px);touch-action:pan-y;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}
@media (min-width:520px){.sheet-body{padding-bottom:32px}}

/* ---------- toast ---------- */
.toast-wrap{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;z-index:60;pointer-events:none;display:flex;justify-content:center}
.toast{pointer-events:auto;background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);transform:translateY(-140%);opacity:0;transition:transform 420ms var(--ease-out),opacity 300ms ease;max-width:100%}
.toast.show{transform:translateY(0);opacity:1}
@media (min-width:520px){.toast-wrap{top:20px}}

/* ---------- onboarding ---------- */
.ob{flex:1;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);overflow-y:auto}
@media (min-width:520px){.ob{padding-top:36px;padding-bottom:28px}}
.ob-dots{display:flex;gap:6px}
.ob-dots i{height:6px;width:6px;border-radius:99px;background:var(--line);transition:width 300ms var(--ease-out),background-color 300ms ease}
.ob-dots i.on{width:22px;background:var(--berry)}
.ob-body{flex:1;display:flex;flex-direction:column}
.enter>*{animation:rise 520ms var(--ease-out) both}
.enter>*:nth-child(2){animation-delay:50ms}
.enter>*:nth-child(3){animation-delay:100ms}
.enter>*:nth-child(4){animation-delay:150ms}
.enter>*:nth-child(5){animation-delay:200ms}
.enter>*:nth-child(6){animation-delay:250ms}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.field{display:block;background:var(--surface);border-radius:16px;padding:12px 16px;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow 180ms ease}
.field.row{display:flex}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--berry)}
.field .lbl{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.field input{border:0;outline:0;background:none;width:100%;font-size:17px;padding:2px 0 0;min-height:28px}
.option{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow 180ms ease,transform 160ms var(--ease-out)}
.option:active{transform:scale(.98)}
.option[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--berry)}
.option .tick{margin-left:auto;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;transition:background-color 180ms ease,box-shadow 180ms ease;flex:none}
.option[aria-pressed="true"] .tick{background:var(--berry);box-shadow:none}
.option .tick svg{opacity:0;transform:scale(.6);transition:opacity 160ms ease,transform 200ms var(--ease-out)}
.option[aria-pressed="true"] .tick svg{opacity:1;transform:none}
.hero-art{display:flex;justify-content:center;gap:0;margin:8px 0 4px}
.hero-art svg{width:88px;height:88px;margin:0 -8px}
.hero-art svg:nth-child(2){width:112px;height:112px;margin-top:-12px;position:relative;z-index:1}
.float{animation:float 4s ease-in-out infinite}
.float.d2{animation-delay:-1.3s}.float.d3{animation-delay:-2.6s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- reveal ---------- */
.reveal-stage{height:280px;display:grid;place-items:center;position:relative}
.pouch{width:170px;height:210px;position:relative;cursor:pointer;transition:transform 160ms var(--ease-out)}
.pouch:active{transform:scale(.97)}
.pouch.wiggle{animation:wiggle 420ms var(--ease-out)}
@keyframes wiggle{0%{transform:rotate(0)}20%{transform:rotate(-6deg) scale(1.02)}45%{transform:rotate(5deg)}70%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
.pouch .top,.pouch .bottom{position:absolute;left:0;right:0;transition:transform 600ms var(--ease-out),opacity 500ms ease}
.pouch.open .top{transform:translate(30px,-90px) rotate(18deg);opacity:0}
.pouch.open .bottom{transform:translateY(80px);opacity:0}
.tear-hint{position:absolute;left:0;right:0;top:44px;height:0;border-top:2px dashed rgba(255,255,255,.55)}
.revealed{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.revealed svg{width:190px;height:190px;opacity:0;transform:scale(.8);filter:blur(10px);transition:opacity 500ms var(--ease-out) 180ms,transform 700ms cubic-bezier(.34,1.56,.64,1) 180ms,filter 500ms var(--ease-out) 180ms}
.revealed.show svg{opacity:1;transform:none;filter:blur(0)}
.glow{position:absolute;width:260px;height:260px;border-radius:50%;opacity:0;transform:scale(.6);transition:opacity 600ms ease 150ms,transform 900ms var(--ease-out) 150ms}
.revealed.show .glow{opacity:1;transform:none}
.spark{position:absolute;width:8px;height:8px;border-radius:2px;opacity:0}
.revealed.show .spark{animation:spark 900ms var(--ease-out) forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(200deg) scale(.4)}}
.reveal-copy{text-align:center;min-height:120px}
.fade-in{animation:rise 480ms var(--ease-out) both}

.check-anim{width:72px;height:72px;border-radius:50%;background:var(--fertile);display:grid;place-items:center;margin:8px auto 0;animation:popIn 480ms cubic-bezier(.34,1.56,.64,1) both}
.check-anim path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw 400ms var(--ease-out) 200ms forwards}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin 700ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (hover:hover) and (pointer:fine){
  .btn:hover{filter:brightness(1.05)}
  .chip:hover{background:#EEE4DD}
  .chip[aria-pressed="true"]:hover{background:var(--ink)}
  .buddy-tile:hover,.icon-btn:hover{transform:translateY(-1px)}
  .tab:hover{color:var(--ink-2)}
  .tab[aria-current="page"]:hover{color:var(--berry)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0ms!important}
  .float{animation:none}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--berry);outline-offset:2px;border-radius:10px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scroller" id="scroller"><main class="screen" id="screen"></main></div>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <div class="toast-wrap" id="toasts"></div>
  <div id="sheet-root"></div>
</div>

<script>
/* =========================================================
   Lune: front-end-only demo. All data is local, all
   "shipping" is simulated on a sped-up clock.
   ========================================================= */

const DAY = 86400000;
const STORE_KEY = 'lune-demo-v1';
const BOX_PRICE = 16;
const TOPUP_PRICE = 9;
const ADDONS = [
  {id:'heat', name:'Heat patches', note:'3 stick-on warmers', price:4},
  {id:'choc', name:'Dark chocolate', note:'70% sea salt bar', price:3},
  {id:'tea',  name:'Sleepy tea',    note:'Chamomile + ginger, 10 bags', price:3},
];
const PRODUCTS = [
  {id:'pads',    name:'Pads',              desc:'Organic cotton, with wings'},
  {id:'tampons', name:'Tampons',           desc:'Organic cotton, applicator'},
  {id:'liners',  name:'Liners',            desc:'For light days & backup'},
  {id:'cup',     name:'Cup care',          desc:'Cup wash + travel wipes'},
];
const FLOWS = ['Light','Regular','Heavy'];
const MOODS = ['Great','Good','Okay','Low','Rough'];
const SYMPTOMS = ['Cramps','Bloating','Headache','Cravings','Tired','Acne','Tender','Moody','Back pain'];
// Demo clock: seconds after order for each stage

function shade(hex, pct){
  if(!hex.startsWith('#')) return '#E7B8D8';
  const n = parseInt(hex.slice(1),16);
  const f = v => Math.max(0,Math.min(255, Math.round(v + v*pct/100)));
  return '#' + [f(n>>16), f((n>>8)&255), f(n&255)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

/* ---------- Dates ---------- */
const sod = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return sod(x); };
const diffDays = (a,b) => Math.round((sod(a)-sod(b))/DAY);
const key = d => { const x = sod(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
const parseKey = k => { const [y,m,dd] = k.split('-').map(Number); return new Date(y,m-1,dd); };
const fmt = (d,o={month:'short',day:'numeric'}) => new Date(d).toLocaleDateString('en-US',o);
const fmtDow = d => fmt(d,{weekday:'short',month:'short',day:'numeric'});
const today = () => sod(new Date());
const money = n => '$' + n.toFixed(2);
const plural = (n,w) => `${n} ${w}${n===1?'':'s'}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Cycle math ---------- */
function cycle(){
  const t = today(), start = parseKey(S.lastStart), L = S.cycleLen;
  const since = Math.max(0, diffDays(t,start));
  const n = Math.floor(since / L);
  const curStart = addDays(start, n*L);
  const day = diffDays(t, curStart) + 1;
  const next = addDays(curStart, L);
  const untilNext = diffDays(next, t);
  const ov = L - 14; // ovulation day (1-indexed offset from start)
  let phase;
  if (day <= S.periodLen) phase = 'Period';
  else if (day < ov - 1) phase = 'Follicular';
  else if (day <= ov + 1) phase = 'Ovulation';
  else phase = 'Luteal';
  return {day, curStart, next, untilNext, phase, ov};
}
function dayType(d){
  const start = parseKey(S.lastStart);
  const off0 = diffDays(d, start);
  if (off0 < 0) return '';
  const off = off0 % S.cycleLen;
  const cycStart = addDays(start, off0 - off);
  if (off < S.periodLen) return cycStart <= today() ? 'period' : 'predicted';
  const ov = S.cycleLen - 14 - 1; // 0-indexed
  if (off === ov) return 'ovulation';
  if (off >= ov - 5 && off <= ov + 1) return 'fertile';
  return '';
}
function nextBoxDate(){
  const c = cycle();
  let arrive = addDays(c.next, -3);
  if (arrive < today()) arrive = addDays(arrive, S.cycleLen);
  return arrive;
}

function boxTotal(){ return BOX_PRICE + ADDONS.filter(a=>S.addons[a.id]).reduce((s,a)=>s+a.price,0); }
function pickBuddy(){
  const pool = [];
  BUDDIES.forEach(b=>{
    const w = {common:10, rare:4, secret:1}[b.rarity];
    const ownedPenalty = S.owned[b.id] ? 0.15 : 1;  // demo: bias toward new ones
    pool.push([b, w*ownedPenalty]);
  });
  const total = pool.reduce((s,[,w])=>s+w,0);
  let r = Math.random()*total;
  for (const [b,w] of pool){ if ((r-=w) <= 0) return b.id; }
  return pool[0][0].id;
}
function placeOrder(kind){
  const o = {
    id: 'LN-' + Math.floor(10000 + Math.random()*89999),
    kind, placedAt: Date.now(),
    items: kind==='box'
      ? [...boxItems(), ...ADDONS.filter(a=>S.addons[a.id]).map(a=>a.name), 'Mystery buddy (sealed)']
      : [`${S.flow==='Heavy'?'12':'8'} ${S.products.includes('tampons')?'tampons':'pads'}`, 'Heat patch', 'Stash pouch'],
    total: kind==='box' ? boxTotal() : TOPUP_PRICE,
    buddy: kind==='box' ? pickBuddy() : null,
    state: kind==='box' ? 'sealed' : null, // sealed | irl | revealed

}

/* ---------- Toasts ---------- */
function toast(msg, icon=''){
  const wrap = document.getElementById('toasts');
  wrap.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role','status');
  el.innerHTML = `${icon}<span>${msg}</span>`;
  wrap.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 450); }, 3200);
  el.onclick = ()=>{ el.classList.remove('show'); };
}

/* ---------- Sheets (drag to dismiss) ---------- */
let sheet = null;
function openSheet(render, opts={}){
  closeSheet(true);
  const root = document.getElementById('sheet-root');
  const bd = document.createElement('div'); bd.className = 'backdrop';
  const sh = document.createElement('div'); sh.className = 'sheet';
  sh.setAttribute('role','dialog'); sh.setAttribute('aria-modal','true');
  sh.innerHTML = `<div class="grab" aria-hidden="true"><i></i></div><div class="sheet-body"></div>`;
  root.append(bd, sh);
  sheet = {bd, sh, render, opts, body: sh.querySelector('.sheet-body')};
  sheet.body.innerHTML = render();
  opts.onMount && opts.onMount(sheet.body);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ bd.classList.add('show'); sh.classList.add('show'); }));
  const opened = performance.now();
  bd.addEventListener('click', ()=>{ if (performance.now() - opened > 350) closeSheet(); });  // ignore ghost taps from the opening tap
  enableDrag(sh);
}
function refreshSheet(){ if (sheet && !sheet.opts.static){ sheet.body.innerHTML = sheet.render(); sheet.opts.onMount && sheet.opts.onMount(sheet.body); } }
function closeSheet(instant){
  if (!sheet) return;
  const {bd, sh, opts} = sheet; sheet = null;
  opts.onClose && opts.onClose();
  if (instant){ bd.remove(); sh.remove(); return; }
  bd.classList.remove('show'); sh.classList.remove('show'); sh.style.transform = '';
  setTimeout(()=>{ bd.remove(); sh.remove(); }, 480);
}
function enableDrag(sh){
  let y0=null, t0=0, dy=0, body = sh.querySelector('.sheet-body');
  sh.addEventListener('pointerdown', e=>{
    const onGrab = e.target.closest('.grab');
    if (!onGrab && (body.scrollTop > 0 || e.target.closest('button,input,a,.seg,.pouch'))) return;
    y0 = e.clientY; t0 = performance.now(); dy = 0;
  });
  window.addEventListener('pointermove', e=>{
    if (y0===null || !sh.isConnected) return;
    dy = e.clientY - y0;
    if (dy > 4){ sh.classList.add('dragging'); sh.style.transform = `translateY(${dy}px)`; }
    else if (dy < 0){ sh.classList.add('dragging'); sh.style.transform = `translateY(${dy*0.15}px)`; }  // resist upward
  });
  window.addEventListener('pointerup', ()=>{
    if (y0===null || !sh.isConnected) { y0=null; return; }
    const v = dy / Math.max(1, performance.now()-t0);
    sh.classList.remove('dragging');
    if (dy > 110 || v > 0.6) closeSheet(); else sh.style.transform = '';
    y0 = null;
  });
}

  } else if (step===2){

    const c = cycle();
    body = `<div class="ob-body enter" style="text-align:center">

function seg(name, opts, val){
  const i = Math.max(0, opts.indexOf(val));
  return `<div class="seg" data-seg="${name}" role="group">
    <span class="thumb" style="width:calc((100% - 8px)/${opts.length});transform:translateX(${i*100}%)"></span>
    ${opts.map(o=>`<button data-act="seg" data-seg="${name}" data-v="${o}" aria-pressed="${o===val}">${o}</button>`).join('')}
  </div>`;
}

/* ---------- Today ---------- */
function greeting(){ const h = new Date().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; }
function renderToday(){
  const c = cycle(); const P = PHASE_COPY[c.phase];
  const pct = Math.min(1, c.day / S.cycleLen);
  const R = 84, C = 2*Math.PI*R;
  const periodFrac = S.periodLen / S.cycleLen;
  const fertStart = (c.ov - 6) / S.cycleLen, fertLen = 7 / S.cycleLen;
  const k = key(today());
  const done = S.checkins[k];
  if (!ui.draft) ui.draft = done ? {mood:done.mood, sym:[...done.sym], editing:false} : {mood:null, sym:[], editing:true};
  const editing = !done || ui.draft.editing;
  const countdown = c.phase==='Period' ? `Day ${c.day} of your period` :
    c.untilNext===0 ? 'Period expected today' : c.untilNext===1 ? 'Period expected tomorrow' : `Period in ${c.untilNext} days`;

  return `
  <header class="row between" style="margin-bottom:16px">
    <div><p class="small muted">${fmt(today(),{weekday:'long',month:'long',day:'numeric'})}</p><h1 class="h2" style="font-size:24px">${greeting()}${S.name?', '+esc(S.name):''}</h1></div>
    <button class="avatar" data-act="profile" aria-label="Profile & settings">${esc((S.name||'L')[0].toUpperCase())}</button>
  </header>

  <section class="card" style="padding:20px 18px 18px">
    <div class="ring-wrap">
      <svg viewBox="0 0 196 196">
        <circle cx="98" cy="98" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
        <circle cx="98" cy="98" r="${R}" fill="none" stroke="var(--predicted)" stroke-width="12" stroke-dasharray="${C*periodFrac} ${C}" transform="rotate(-90 98 98)"/>
        <circle cx="98" cy="98" r="${R}" fill="none" stroke="var(--fertile)" stroke-width="12" stroke-dasharray="${C*fertLen} ${C}" stroke-dashoffset="${-C*fertStart}" transform="rotate(-90 98 98)"/>
        <circle cx="98" cy="98" r="${R}" fill="none" stroke="${P.color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${Math.max(1,C*pct)} ${C}" transform="rotate(-90 98 98)" style="transition:stroke-dasharray 800ms var(--ease-out)"/>
        <circle cx="${98 + R*Math.sin(pct*2*Math.PI)}" cy="${98 - R*Math.cos(pct*2*Math.PI)}" r="9" fill="#fff" stroke="${P.color}" stroke-width="4"/>
      </svg>
      <div class="ring-center">
        <span class="small muted">Cycle day</span>
        <span class="big tnum">${c.day}</span>
        <span class="pill" style="margin-top:8px;background:transparent;box-shadow:inset 0 0 0 1.5px ${P.color};color:var(--ink)"><i class="dot" style="background:${P.color}"></i>${c.phase} phase</span>
      </div>
    </div>
    <div class="row between" style="margin-top:16px">
      <div><div style="font-weight:600;font-size:17px">${countdown}</div><div class="small muted">Expected ${fmtDow(c.next)}</div></div>
      <button class="btn sm ghost" data-act="log-period" data-v="${k}">Period started</button>

    <div class="row between">
      <div><p class="eyebrow">Daily check-in</p><h2 class="h2" style="margin-top:2px">${editing?'How are you feeling?':'Checked in for today'}</h2></div>
      ${!editing?`<button class="link" data-act="ci-edit">Edit</button>`:''}
    </div>
    ${editing ? `
      <div class="chips" style="margin-top:14px">${MOODS.map(m=>`<button class="chip" data-act="ci-mood" data-v="${m}" aria-pressed="${ui.draft.mood===m}">${m}</button>`).join('')}</div>

      <button class="btn block" style="margin-top:16px" data-act="ci-save" ${ui.draft.mood?'':'disabled'}>${done?'Update check-in':'Save check-in · +1 star'}</button>
    ` : `
      <div class="chips" style="margin-top:12px"><span class="pill berry">${esc(done.mood)}</span>${done.sym.map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div>

  <section class="card" style="margin-top:12px">

}
function symptomTip(ci){
  if (ci.sym.includes('Cramps')) return 'Cramps logged. A heat patch and some slow stretching can help. We add heat patches to boxes if you want them.';
  if (ci.sym.includes('Cravings')) return 'Cravings are hormonal, not a lack of willpower. Be nice to yourself.';
  if (ci.mood==='Low'||ci.mood==='Rough') return 'Rough day noted. It gets counted, so Lune can spot patterns across cycles.';
  return 'Logged. After a few cycles Lune starts spotting your patterns.';
}

/* ---------- Calendar ---------- */
function renderCalendar(){
  if (!ui.calMonth){ const t = today(); ui.calMonth = new Date(t.getFullYear(), t.getMonth(), 1); }
  const m = ui.calMonth, y = m.getFullYear(), mo = m.getMonth();
  const first = new Date(y, mo, 1), days = new Date(y, mo+1, 0).getDate();
  const lead = first.getDay();
  const boxDay = S.plan==='box' && !S.paused ? key(nextBoxDate()) : null;
  const tk = key(today());
  let cells = '';
  for (let i=0;i<lead;i++) cells += `<span class="day out"></span>`;
  for (let d=1; d<=days; d++){
    const dt = new Date(y, mo, d), k = key(dt), t = dayType(dt);
    const lbl = `${fmt(dt,{month:'long',day:'numeric'})}${k===boxDay?', Lune Box arrives':''}${t?', '+({period:'period',predicted:'predicted period',fertile:'fertile window',ovulation:'estimated ovulation'})[t]:''}`;
    cells += `<button class="day ${k===boxDay?'boxday':t} ${k===tk?'today':''}" data-act="day" data-v="${k}" aria-label="${lbl}">${d}${S.checkins[k]?'<i class="mk"></i>':''}</button>`;
  }
  const c = cycle();
  const ovDate = addDays(c.curStart, c.ov - 1);
  const ovNext = ovDate < today() ? addDays(ovDate, S.cycleLen) : ovDate;
  const logged = Object.keys(S.checkins).length;
  return `
  <header class="row between" style="margin-bottom:16px">
    <h1 class="title">Calendar</h1>
    <button class="avatar" data-act="profile" aria-label="Profile & settings">${esc((S.name||'L')[0].toUpperCase())}</button>
  </header>
  <section class="card">
    <div class="row between" style="margin-bottom:14px">
      <button class="icon-btn" data-act="cal-nav" data-v="-1" aria-label="Previous month">${I.chevL}</button>
      <h2 class="h2">${fmt(m,{month:'long',year:'numeric'})}</h2>
      <button class="icon-btn" data-act="cal-nav" data-v="1" aria-label="Next month">${I.chevR}</button>
    </div>
    <div class="cal-head">${['S','M','T','W','T','F','S'].map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="legend" style="margin-top:14px">
      <span><i class="dot" style="background:var(--period)"></i>Period</span>
      <span><i class="dot" style="background:var(--predicted)"></i>Predicted</span>
      <span><i class="dot" style="background:#9FD2B4"></i>Fertile</span>
      ${boxDay?`<span><svg width="12" height="12" viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="4" fill="#3A2140"/></svg>Box arrives</span>`:''}
    </div>
  </section>
  <section class="card" style="margin-top:12px">
    <p class="eyebrow">Coming up</p>
    <div style="margin-top:6px">
      <div class="list-row"><i class="dot" style="background:var(--period);width:10px;height:10px"></i><div style="flex:1">Next period</div><strong>${fmtDow(c.next)}</strong></div>
      <div class="list-row"><i class="dot" style="background:#9FD2B4;width:10px;height:10px"></i><div style="flex:1">Estimated ovulation</div><strong>${fmtDow(ovNext)}</strong></div>
      ${S.plan==='box'?`<div class="list-row"><i class="dot" style="background:#3A2140;width:10px;height:10px"></i><div style="flex:1">Lune Box arrives</div><strong>${S.paused?'Skipped':fmtDow(nextBoxDate())}</strong></div>`:''}
    </div>
  </section>
  <p class="small muted" style="text-align:center;margin-top:14px">Tap any day to log. ${plural(logged,'check-in')} so far.</p>

}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  const A = {
    'tab':()=>{ const same = ui.tab===v; ui.tab=v; if (v==='calendar') ui.calMonth=null; closeSheet(); renderTabs(); renderScreen(); if(!same) document.getElementById('scroller').scrollTop=0; },
    'ob-next':()=>{
      if (ui.obStep===1){ S.name = document.getElementById('ob-name').value.trim(); const dv = document.getElementById('ob-date').value; if (dv && parseKey(dv) <= today()) S.lastStart = dv; }
      ui.obStep++; save(); render();
    },
    'ob-back':()=>{ if (ui.obStep===1) S.name = document.getElementById('ob-name').value.trim(); ui.obStep=Math.max(0,ui.obStep-1); render(); },
    'ob-len':()=>{ S.name = document.getElementById('ob-name').value.trim(); const dv=document.getElementById('ob-date').value; if (dv) S.lastStart=dv;
      S.cycleLen = clamp(S.cycleLen + +v, 21, 40); render(); },
    'ob-prod':()=>{ toggleProduct(v); render(); },
    'ob-finish':()=>{ S.onboarded=true; ui.tab='today'; save(); render(); },
    'seg':()=>{
      const name = el.dataset.seg;
      if (name==='flow'){ S.flow = v; save(); }
      const wrap = el.closest('.seg'); const btns=[...wrap.querySelectorAll('button')]; const i=btns.indexOf(el);
      wrap.querySelector('.thumb').style.transform = `translateX(${i*100}%)`;
      btns.forEach(b=>b.setAttribute('aria-pressed', b===el));
      if (S.onboarded && ui.tab==='box') setTimeout(renderScreen, 260);
    },
    'ci-mood':()=>{ ui.draft.mood=v; renderScreen(); },
    'ci-sym':()=>{ const s=ui.draft.sym; const i=s.indexOf(v); i>=0?s.splice(i,1):s.push(v); renderScreen(); },
    'ci-edit':()=>{ ui.draft.editing=true; renderScreen(); },
    'ci-save':()=>{
      const k = key(today()); const first = !S.checkins[k];
      S.checkins[k] = {mood:ui.draft.mood, sym:[...ui.draft.sym]};
      ui.draft.editing=false;
      if (first){ S.stars=Math.min(5,S.stars+1); S.streak++; }
      save(); renderScreen();
      toast(first ? (S.stars>=5?'Check-in saved. Your free pouch is ready!':'Check-in saved. +1 moon star') : 'Check-in updated');
    },
    'free-pouch':()=>{ if (S.stars<5) return; const b = BUDDIES.find(x=>x.id===pickBuddy()); openRevealSheet(b,{physical:false,onDone:()=>{ S.stars=0; }}); },
    'log-period':()=>{
      if (S.lastStart===v){ closeSheet(); toast('Already marked as your period start'); return; }
      S.lastStart=v; save(); closeSheet(); renderScreen();
      toast(`Period start logged for ${fmt(parseKey(v))}. Predictions updated.`);
    },
    'profile':()=>openProfile(),
    'close':()=>closeSheet(),
    'cal-nav':()=>{ ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth() + +v, 1); renderScreen(); },
    'day':()=>openDay(v),
    'checkout':()=>openCheckout(v),
    'pay':()=>sheet && sheet.pay && sheet.pay(),
    'order':()=>openOrder(v),
    'order-from-done':()=>{ ui.tab='box'; render(); openOrder(v); },
    'reveal':()=>openReveal(v),
    'irl':()=>{ const o=findOrder(v); o.state='irl'; save(); closeSheet(); render(); toast('Saved for IRL. We will keep your buddy a secret.'); },
    'goto-shelf':()=>{ ui.tab='shelf'; closeSheet(); render(); document.getElementById('scroller').scrollTop=0; },
    'goto-box':()=>{ ui.tab='box'; closeSheet(); render(); document.getElementById('scroller').scrollTop=0; },
    'buddy':()=>openBuddy(v),
    'addon':()=>{ S.addons[v]=!S.addons[v]; save(); el.setAttribute('aria-checked', S.addons[v]); setTimeout(renderScreen, 240); },
    'edit-products':()=>openProducts(),
    'prod-toggle':()=>{ toggleProduct(v); refreshSheet(); renderScreen(); },
    'skip':()=>{ S.paused=!S.paused; save(); refreshSheet(); renderScreen(); toast(S.paused?'Next box skipped. You will not be charged.':'Box resumed'); },
    'ship-now':()=>{ const o = placeOrder('box'); render(); openOrder(o.id); },

    'confirm-yes':()=>{ const f = sheet && sheet.onYes; closeSheet(); f && f(); },
    'len':()=>{ S.cycleLen=clamp(S.cycleLen + +v,21,40); save(); refreshSheet(); renderScreen(); },
    'plen':()=>{ S.periodLen=clamp(S.periodLen + +v,2,9); save(); refreshSheet(); renderScreen(); },
    'fast':()=>{
      // keep each order's current progress when switching clock speed
      S.orders.forEach(o=>{ const e = orderElapsed(o); S.demoFast = !S.demoFast; o.placedAt = Date.now() - e*1000/(S.demoFast?1:0.02); S.demoFast = !S.demoFast; });
      S.demoFast=!S.demoFast; save(); refreshSheet();
    },
    'demo-stars':()=>{ S.stars=5; save(); closeSheet(); ui.tab='today'; render(); toast('5 moon stars added'); },
    'reset':()=>confirmSheet('Reset the demo?', 'This clears everything on this device and restarts onboarding.', 'Reset', ()=>{ S=freshState(); ui.obStep=0; ui.draft=null; ui.tab='today'; save(); render(); }),
  };
  if (A[act]){ A[act](); }
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape') closeSheet(); });
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function toggleProduct(id){
  const i = S.products.indexOf(id);
  if (i>=0){ if (S.products.length>1 || !S.onboarded) S.products.splice(i,1); else toast('Keep at least one product'); }
  else S.products.push(id);
  save();
}

/* ---------- Simulated shipping clock ---------- */
setInterval(()=>{
  if (!S.onboarded) return;
  let changed=false;
  S.orders.forEach(o=>{
    const st = orderStage(o);
    const prev = ui.lastStages[o.id];
    if (prev===undefined){ ui.lastStages[o.id]=st; return; }
    if (st!==prev){
      ui.lastStages[o.id]=st; changed=true;
      if (st===4) toast(o.kind==='box'?'Your Lune Box was delivered':'Your top-up kit was delivered', I.gift);
      else if (st===2) toast(`${o.id} has shipped`);
    }
  });
  if (changed){
    renderTabs();
    if (ui.tab==='today'||ui.tab==='box') renderScreen();
    if (sheet && sheet.orderId) refreshSheet();
  }
}, 1000);

render();
</script>
</body>
